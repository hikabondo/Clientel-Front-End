<div class="container-fluid">
    <div class="row p-2 bg-info">
        <div class="col-6">
            <h4 class=" text-center"> Customer App</h4>
        </div>
        <div class="col-6 text-end">
            <button class="btn btn-primary" (click)="openModal()">Add Customer</button>
        </div>
    </div>
    <div class="col-md-12" >
        <input type="text" placeholder="Search by Title" class="form-control" style="width: 400px; border-radius: 10px; border: 1px solid rgb(5, 28, 119);"(keyup)="applyFilter($event)" > 
       </div>
    <table class="table table-bordered table-striped"> 
        <thead>
            <tr>
                <th>Customer ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th class="text-center">Action</th>
            </tr> 
        </thead>
        <tbody>
            @for(customer of customerList ; track $index){
                <tr>
                    <td>{{customer.customerID}}</td>
                    <td>{{customer.name}}</td>
                    <td>{{customer.email}}</td>
                    <td>{{customer.phoneNumber}}</td>
                    <td class="text-center">
                      <button class="btn btn-primary" (click)="onEdit(customer)">Edit</button>  
                      <button class="btn btn-danger" (click)="onDelete(customer.customerID)">Delete</button>
                    </td>
                </tr>
            }
        
        </tbody>
    </table>
    </div>
    
    <!-- The Modal -->
    <div class="modal" id="customerModal" #customerModal>
        <div class="modal-dialog">
          <div class="modal-content">
      
            <!-- Modal Header -->
            <div class="modal-header">  
              <h4 class="modal-title">{{customerForm.value.customerID !=0 ? 'Update Customer':'Add Customer'}} </h4>
              <button type="button" class="btn-close" data-bs-dismiss="modal" (click)="closeModal()"></button>
            </div>
      <form [formGroup]="customerForm" (ngSubmit)="onSubmit()">
                <!-- Modal body -->
                <div class="modal-body">
                    <div class="row">
                      <div class="col-12">
                          <input type="text" name="name" formControlName="name" class="form-control" placeholder="Customer Name"/>
                      </div>
                    </div>
                    <div class="row mt-3">
                      <div class="col-6">
                          <input type="text" name="email" formControlName="email" class="form-control" placeholder="Email"/>
                      </div>
                      <div class="col-6">
                          <input type="text" name="phoneNumber" formControlName="phoneNumber" class="form-control" placeholder="Phone Number"/>
                      </div>
                    </div>
                  </div>
                   <!-- Modal footer -->
            <div class="modal-footer">
                <button type="submit" [disabled]="this.customerForm.invalid" class="btn btn-primary" data-bs-dismiss="modal" (click)="closeModal()">{{customerForm.value.customerID !==0 ? 'Update':'Save'}}</button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal" (click)="closeModal()">Close</button>
            </div>  
      </form>
          </div>
     </div>
    </div>
