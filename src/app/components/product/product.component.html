<div class="container-fluid">
    <div class="row p-2 bg-info">
        <div class="col-6">
            <h4 class=" text-center"> product App</h4>
        </div>
        <div class="col-6 text-end">
            <button class="btn btn-primary" (click)="openModal()">Add Product</button>
        </div>
    </div>
    <div class="col-md-12" >
        <input type="text" placeholder="Search by Title" class="form-control" style="width: 400px; border-radius: 10px; border: 1px solid rgb(5, 28, 119);"(keyup)="applyFilter($event)" > 
       </div>
    <table class="table table-bordered table-striped"> 
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th class="text-center">Action</th>
            </tr> 
        </thead>
        <tbody>
            @for(product of productList ; track $index){
                <tr>
                    <td>{{product.productID}}</td>
                    <td>{{product.name}}</td>
                    <td>{{product.description}}</td>
                    <td>{{product.price}}</td>
                    <td class="text-center">
                      <button class="btn btn-primary" (click)="onEdit(product)">Edit</button>  
                      <button class="btn btn-danger" (click)="onDelete(product.productID)">Delete</button>
                    </td>
                </tr>
            }
        
        </tbody>
    </table>
    </div>
    
    <!-- The Modal -->
    <div class="modal" id="productModal" #productModal>
        <div class="modal-dialog">
          <div class="modal-content">
      
            <!-- Modal Header -->
            <div class="modal-header">  
              <h4 class="modal-title">{{productForm.value.productID !=0 ? 'Update Product':'Add Product'}} </h4>
              <button type="button" class="btn-close" data-bs-dismiss="modal" (click)="closeModal()"></button>
            </div>
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
                <!-- Modal body -->
                <div class="modal-body">
                    <div class="row">
                      <div class="col-12">
                          <input type="text" name="name" formControlName="name" class="form-control" placeholder="Product Name"/>
                      </div>
                    </div>
                    <div class="row mt-3">
                      <div class="col-6">
                          <input type="text" name="description" formControlName="description" class="form-control" placeholder="Description"/>
                      </div>
                      <div class="col-6">
                          <input type="text" name="price" formControlName="price" class="form-control" placeholder="Price"/>
                      </div>
                    </div>
                  </div>
                   <!-- Modal footer -->
            <div class="modal-footer">
                <button type="submit" [disabled]="this.productForm.invalid" class="btn btn-primary" data-bs-dismiss="modal" (click)="closeModal()">{{productForm.value.productID !==0 ? 'Update':'Save'}}</button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal" (click)="closeModal()">Close</button>
            </div>  
      </form>
          </div>
     </div>
    </div>
